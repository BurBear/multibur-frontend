  <header class="top">
    <div class="brand-wrap">
      <div class="brand-main">MultiBur</div>
      <span class="role-chip">CORTADOR</span>
    </div>
    <div>
      <div class="brand">Selector de trabajo</div>
      <div class="brand-sub">Elige el modulo que vas a realizar en esta sesion.</div>
    </div>
    <div class="top-right">
      <span id="userPill" class="pill">-</span>
      <button id="btnLogout" class="btn btn-ghost" type="button">Cerrar sesion</button>
    </div>
  </header>

  <main class="main">
    <section class="hub-card">
      <div class="hub-copy">
        <h1>QUE ES LO QUE VA A REALIZAR?</h1>
      </div>

      <div class="hub-grid">
        <button id="cardCorte" class="hub-option is-corte" type="button">
          <span class="hub-option-title">CORTE</span>
          <span class="hub-option-sub">Entrar al tablero de corte</span>
        </button>

        <button id="cardAcabados" class="hub-option is-acabados" type="button">
          <span class="hub-option-title">ACABADOS</span>
          <span class="hub-option-sub">Entrar al tablero de acabados</span>
        </button>

        <button id="cardMaterial" class="hub-option is-disabled" type="button" disabled aria-disabled="true">
          <span class="hub-option-title">MATERIAL</span>
          <span class="hub-option-coming">PROXIMAMENTE</span>
          <span class="hub-option-sub">Se habilitara proximamente</span>
        </button>
      </div>

      <div id="msgHub" class="msg"></div>
    </section>
  </main>

  <script src="../js/loader.js"></script>
