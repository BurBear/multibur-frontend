<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MultiBur | Admin  -  Materiales & Formatos</title>
  <script>
    (function () {
      const tab = new URLSearchParams(window.location.search).get("tab");
      if (tab) document.documentElement.setAttribute("data-tab", tab.toLowerCase());
    })();
  </script>
  <style>
    *{box-sizing:border-box}
    body{font-family:system-ui,Arial; margin:0; background:#0b1220; color:#e8eefc;}
    .top{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #243250; background:#0d1730;}
    .brand-wrap{display:flex; flex-direction:column; gap:4px}
    .brand{font-size:34px; font-weight:900; letter-spacing:-.02em}
    .role-chip{width:max-content; font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid #1f7a57; color:#22c55e; background:rgba(34,197,94,.12)}
    .top-right{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
    .nav-link{color:#c6d6f3; text-decoration:none; font-size:14px; opacity:.9}
    .nav-link:hover{opacity:1}
    .nav-link.is-active{
      opacity:1; color:#ffffff; background:#143c77; border:1px solid #2563eb;
      border-radius:999px; padding:6px 10px; font-weight:700;
    }
    .wrap{max-width:1200px; margin:0 auto; padding:16px;}
    .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
    @media (max-width: 980px){ .grid{grid-template-columns:1fr;} }
    html[data-tab="materiales"] .grid,
    html[data-tab="formatos"] .grid{grid-template-columns:1fr;}
    html[data-tab="materiales"] #sectionFormatos{display:none;}
    html[data-tab="formatos"] #sectionMateriales{display:none;}
    .card{background:#121b2e; border:1px solid #243250; border-radius:14px; padding:14px;}
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between}
    .row2{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .btn{padding:10px 12px; border-radius:10px; border:1px solid #2a3b61; background:#0e1627; color:#e8eefc; cursor:pointer; font-weight:800}
    .btn:hover{border-color:#3b4f79}
    .btn-ghost{background:#0e1627; color:#e8eefc; border:1px solid #2a3b61;}
    .btn-primary{background:#22c55e; border-color:#22c55e; color:#05120a;}
    .btn-danger{background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.4); color:#fecaca}
    .pill{padding:6px 10px; border:1px solid #2a3b61; border-radius:999px; font-size:12px; opacity:.95}
    .small{font-size:12px; opacity:.82}
    table{width:100%; border-collapse:collapse; font-size:13px;}
    th,td{padding:9px 8px; border-bottom:1px solid #243250; vertical-align:top;}
    th{text-align:left; opacity:.85; font-weight:800;}
    tr:hover td{background:#0e1627;}
    input,select,textarea{
      padding:9px 10px; border-radius:10px;
      border:1px solid #2a3b61; background:#0e1627; color:#e8eefc;
    }
    textarea{min-height:58px; resize:vertical; width:100%;}
    .msg{margin-top:10px; font-size:12px; white-space:pre-wrap; opacity:.95}
    .w-100{width:100%}
    .col-id{width:60px}
    .col-actions{width:190px}
    .pager{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-top:10px}
    .pager-left,.pager-right{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .pager .meta{font-size:12px; opacity:.82}
    .pager select{min-width:90px}
    .data-table-wrap{
      overflow:auto;
      margin-top:12px;
      border-radius:12px;
      border:1px solid #243250;
      max-height:calc(100vh - 390px);
    }
    .data-table-wrap thead th{
      position:sticky;
      top:0;
      z-index:1;
      background:#121b2e;
    }
    html[data-tab="materiales"] .lnk-materiales{opacity:1; color:#fff; background:#143c77; border:1px solid #2563eb; border-radius:999px; padding:6px 10px; font-weight:700}
    html[data-tab="formatos"] .lnk-formatos{opacity:1; color:#fff; background:#143c77; border:1px solid #2563eb; border-radius:999px; padding:6px 10px; font-weight:700}
    @media (max-width: 980px){
      .data-table-wrap{max-height:none}
    }
  </style>
</head>
<body>
<header class="top">
  <div class="brand-wrap">
    <div class="brand">MultiBur</div>
    <div class="role-chip">ADMIN</div>
  </div>
  <div class="top-right">
    <a class="nav-link" href="./admin_reportes.html">Reportes</a>
    <a class="nav-link" href="./admin_catalogos.html?tab=clientes">Clientes</a>
    <a class="nav-link" href="./admin_catalogos.html?tab=maquinas">Maquinas</a>
    <a class="nav-link lnk-materiales" href="./admin_materiales_formatos.html?tab=materiales">Materiales</a>
    <a class="nav-link lnk-formatos" href="./admin_materiales_formatos.html?tab=formatos">Formatos</a>
    <a class="nav-link" href="./admin.html">Pizarra</a>
    <span id="userPill" class="pill">-</span>
    <button id="btnLogout" class="btn btn-danger">Salir</button>
  </div>
</header>

<div class="wrap">
  <div class="grid">

    <!-- MATERIALES -->
    <section id="sectionMateriales" class="card">
      <div class="row">
        <h3 style="margin:0">Materiales</h3>
        <div class="row2">
          <button id="btnReloadMat" class="btn btn-ghost">Recargar</button>
          <button id="btnAddMat" class="btn btn-primary">Agregar</button>
        </div>
      </div>

      <div class="row2" style="margin-top:10px">
        <input id="mat_nombre" placeholder="Nombre (ej: Couche)" style="flex:1; min-width:200px" />
        <input id="mat_gramaje" type="number" min="0" placeholder="Gramaje (ej: 300)" style="width:170px" />
        <input id="mat_prov" placeholder="Proveedor (opcional)" style="flex:1; min-width:200px" />
      </div>
      <div class="row2" style="margin-top:10px">
        <input id="mat_filter" placeholder="Buscar material por nombre, gramaje o proveedor..." style="flex:1; min-width:220px" />
      </div>

      <div class="pager">
        <div class="pager-left">
          <div id="mat_stats" class="meta">Mostrando 0-0 de 0</div>
        </div>
        <div class="pager-right">
          <label class="small" for="mat_page_size">Mostrar</label>
          <select id="mat_page_size">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <button id="btnMatPrev" class="btn btn-ghost" type="button">Anterior</button>
          <div id="mat_page_info" class="meta">1 / 1</div>
          <button id="btnMatNext" class="btn btn-ghost" type="button">Siguiente</button>
        </div>
      </div>

      <div class="data-table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th>Nombre</th>
              <th>Gramaje</th>
              <th>Proveedor</th>
              <th class="col-actions">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbMat"></tbody>
        </table>
      </div>

      <div id="msgMat" class="msg"></div>
    </section>

    <!-- FORMATOS -->
    <section id="sectionFormatos" class="card">
      <div class="row">
        <h3 style="margin:0">Formatos</h3>
        <div class="row2">
          <button id="btnReloadFor" class="btn btn-ghost">Recargar</button>
          <button id="btnAddFor" class="btn btn-primary">Agregar</button>
        </div>
      </div>

      <div class="row2" style="margin-top:10px">
        <input id="for_nombre" placeholder="Nombre (opcional: 43 x 30.5)" style="flex:1; min-width:220px" />
        <input id="for_ancho" type="number" step="0.01" placeholder="Ancho (ej: 43.0)" style="width:180px" />
        <input id="for_alto" type="number" step="0.01" placeholder="Alto (ej: 30.5)" style="width:180px" />
      </div>
      <div class="row2" style="margin-top:10px">
        <input id="for_filter" placeholder="Buscar formato por nombre, ancho o alto..." style="flex:1; min-width:220px" />
      </div>

      <div class="pager">
        <div class="pager-left">
          <div id="for_stats" class="meta">Mostrando 0-0 de 0</div>
        </div>
        <div class="pager-right">
          <label class="small" for="for_page_size">Mostrar</label>
          <select id="for_page_size">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <button id="btnForPrev" class="btn btn-ghost" type="button">Anterior</button>
          <div id="for_page_info" class="meta">1 / 1</div>
          <button id="btnForNext" class="btn btn-ghost" type="button">Siguiente</button>
        </div>
      </div>

      <div class="data-table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th>Nombre</th>
              <th>Ancho</th>
              <th>Alto</th>
              <th class="col-actions">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbFor"></tbody>
        </table>
      </div>

      <div id="msgFor" class="msg"></div>
    </section>

  </div>
</div>

<script type="module" src="../js/admin_materiales_formatos.js"></script>
</body>
</html>
