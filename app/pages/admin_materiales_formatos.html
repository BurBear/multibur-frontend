<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MultiBur | Admin  -  Materiales & Formatos</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <script>
    (function () {
      const tab = new URLSearchParams(window.location.search).get("tab");
      if (tab) document.documentElement.setAttribute("data-tab", tab.toLowerCase());
    })();
  </script>
  

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="page-admin-materiales">
<header class="top">
  <div class="brand-wrap">
    <div class="brand">MultiBur</div>
    <div class="role-chip">ADMIN</div>
  </div>
  <div class="top-right">
    <a class="nav-link" href="./admin_reportes.html">Reportes</a>
    <a class="nav-link" href="./admin_catalogos.html?tab=clientes">Clientes</a>
    <a class="nav-link" href="./admin_catalogos.html?tab=maquinas">Maquinas</a>
    <a class="nav-link lnk-materiales" href="./admin_materiales_formatos.html?tab=materiales">Materiales</a>
    <a class="nav-link lnk-formatos" href="./admin_materiales_formatos.html?tab=formatos">Formatos</a>
    <a class="nav-link" href="./admin.html">Pizarra</a>
    <span id="userPill" class="pill">-</span>
    <button id="btnLogout" class="btn btn-danger">Salir</button>
  </div>
</header>

<div class="wrap">
  <div class="grid">

    <!-- MATERIALES -->
    <section id="sectionMateriales" class="card">
      <div class="row">
        <h3 class="inl-1">Materiales</h3>
        <div class="row2">
          <button id="btnReloadMat" class="btn btn-ghost">Recargar</button>
          <button id="btnAddMat" class="btn btn-primary">Agregar</button>
        </div>
      </div>

      <div class="row2 inl-2">
        <input id="mat_nombre" placeholder="Nombre (ej: Couche)" class="inl-3">
        <input id="mat_gramaje" type="number" min="0" placeholder="Gramaje (ej: 300)" class="inl-4">
        <input id="mat_prov" placeholder="Proveedor (opcional)" class="inl-3">
      </div>
      <div class="row2 inl-2">
        <input id="mat_filter" placeholder="Buscar material por nombre, gramaje o proveedor..." class="inl-5">
      </div>

      <div class="pager">
        <div class="pager-left">
          <div id="mat_stats" class="meta">Mostrando 0-0 de 0</div>
        </div>
        <div class="pager-right">
          <label class="small" for="mat_page_size">Mostrar</label>
          <select id="mat_page_size">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <button id="btnMatPrev" class="btn btn-ghost" type="button">Anterior</button>
          <div id="mat_page_info" class="meta">1 / 1</div>
          <button id="btnMatNext" class="btn btn-ghost" type="button">Siguiente</button>
        </div>
      </div>

      <div class="data-table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th>Nombre</th>
              <th>Gramaje</th>
              <th>Proveedor</th>
              <th class="col-actions">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbMat"></tbody>
        </table>
      </div>

      <div id="msgMat" class="msg"></div>
    </section>

    <!-- FORMATOS -->
    <section id="sectionFormatos" class="card">
      <div class="row">
        <h3 class="inl-1">Formatos</h3>
        <div class="row2">
          <button id="btnReloadFor" class="btn btn-ghost">Recargar</button>
          <button id="btnAddFor" class="btn btn-primary">Agregar</button>
        </div>
      </div>

      <div class="row2 inl-2">
        <input id="for_nombre" placeholder="Nombre (opcional: 43 x 30.5)" class="inl-5">
        <input id="for_ancho" type="number" step="0.01" placeholder="Ancho (ej: 43.0)" class="inl-6">
        <input id="for_alto" type="number" step="0.01" placeholder="Alto (ej: 30.5)" class="inl-6">
      </div>
      <div class="row2 inl-2">
        <input id="for_filter" placeholder="Buscar formato por nombre, ancho o alto..." class="inl-5">
      </div>

      <div class="pager">
        <div class="pager-left">
          <div id="for_stats" class="meta">Mostrando 0-0 de 0</div>
        </div>
        <div class="pager-right">
          <label class="small" for="for_page_size">Mostrar</label>
          <select id="for_page_size">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <button id="btnForPrev" class="btn btn-ghost" type="button">Anterior</button>
          <div id="for_page_info" class="meta">1 / 1</div>
          <button id="btnForNext" class="btn btn-ghost" type="button">Siguiente</button>
        </div>
      </div>

      <div class="data-table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th>Nombre</th>
              <th>Ancho</th>
              <th>Alto</th>
              <th class="col-actions">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbFor"></tbody>
        </table>
      </div>

      <div id="msgFor" class="msg"></div>
    </section>

  </div>
</div>

<script type="module" src="../js/admin_materiales_formatos.js"></script>
</body>
</html>
