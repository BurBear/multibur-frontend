<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Multigrafica Burgos | Acceso</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body class="page-login">
  <div class="card">
    <div class="header">
      <div class="brand-subtitle">Sistema de Produccion</div>
      <h1>Multigrafica Burgos</h1>
      <p>Ingresa tus credenciales para acceder</p>
    </div>

    <div class="input-group">
      <label for="email">Correo electronico</label>
      <input id="email" type="email" placeholder="nombre@multibur.com" autocomplete="username" />
    </div>

    <div class="input-group">
      <label for="pass">Contrasena</label>
      <div class="password-wrap">
        <input id="pass" type="password" placeholder="********" autocomplete="current-password" />
        <button id="showPass" class="pass-toggle" type="button" aria-label="Mostrar contrasena" aria-pressed="false">
          <svg id="showPassIcon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="option-row">
      <label class="option-check" for="rememberEmail">
        <input id="rememberEmail" type="checkbox" />
        <span>Recordar correo</span>
      </label>
    </div>

    <button id="btnLogin">Ingresar al Sistema</button>

    <div class="row">
      <button id="btnLogout" class="btn2 inl-1" type="button">Cerrar sesion</button>
      <button id="btnGo" class="btn2 inl-1" type="button">Ir al Dashboard</button>
    </div>

    <div id="msg" class="msg"></div>

    <div class="footer-help">
      &copy; 2026 Multigrafica Burgos. <br>
      <span class="inl-2">Gestion de usuarios via Supabase Auth.</span>
    </div>
  </div>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
