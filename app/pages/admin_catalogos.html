<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MultiBur | Admin  -  Catalogos</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <script>
    (function () {
      const tab = new URLSearchParams(window.location.search).get("tab");
      if (tab) document.documentElement.setAttribute("data-tab", tab.toLowerCase());
    })();
  </script>
  

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="page-admin-catalogos">
<header class="top">
  <div class="brand-wrap">
    <div class="brand">MultiBur</div>
    <div class="role-chip">ADMIN</div>
  </div>
  <div class="top-right">
    <a class="nav-link" href="./admin_reportes.html">Reportes</a>
    <a class="nav-link lnk-clientes" href="./admin_catalogos.html?tab=clientes">Clientes</a>
    <a class="nav-link lnk-maquinas" href="./admin_catalogos.html?tab=maquinas">Maquinas</a>
    <a class="nav-link" href="./admin_materiales_formatos.html?tab=materiales">Materiales</a>
    <a class="nav-link" href="./admin_materiales_formatos.html?tab=formatos">Formatos</a>
    <a class="nav-link" href="./admin.html">Pizarra</a>
    <span id="userPill" class="pill">-</span>
    <button id="btnLogout" class="btn btn-danger">Salir</button>
  </div>

</header>

<div class="wrap">
  <div class="grid">

    <!-- CLIENTES -->
    <section id="sectionClientes" class="card">
      <div class="row">
        <h3 class="inl-1">Clientes</h3>
        <div class="row2">
          <button id="btnReloadClientes" class="btn btn-ghost">Recargar</button>
          <button id="btnExportClientes" class="btn btn-ghost">Exportar CSV</button>
          <button id="btnImportClientes" class="btn btn-ghost">Importar CSV</button>
          <button id="btnAddCliente" class="btn btn-primary">Agregar</button>
          <input id="c_import_file" type="file" accept=".csv,text/csv" class="inl-2">
        </div>
      </div>

      <div class="row2 inl-3">
        <input id="c_nombre" placeholder="Nombre (ej: UPAO)" class="inl-4">
        <input id="c_telefono" placeholder="Telefono (opcional)" class="inl-5">
      </div>
      <div class="row2 inl-3">
        <select id="c_tipo_cliente" class="inl-6">
          <option value="DIRECTO">DIRECTO</option>
          <option value="SERVICIO">SERVICIO</option>
        </select>
        <select id="c_doc_tipo" class="inl-7">
          <option value="RUC">RUC</option>
          <option value="SUR">SUR</option>
        </select>
        <input id="c_doc_numero" placeholder="Doc. fiscal numero" class="inl-4">
        <label class="small inl-8">
          <input id="c_req_oc" type="checkbox" />
          Requiere OC por defecto
        </label>
      </div>
      <div class="row2 inl-3">
        <input id="c_filter" placeholder="Buscar cliente por nombre, telefono o documento..." class="inl-4">
      </div>
      <div id="c_import_hint" class="small inl-9">
        Importar CSV procesa y guarda automaticamente. No necesitas usar el boton Agregar.
      </div>
      <div class="pager">
        <div id="c_stats" class="meta">Clientes: 0</div>
        <div class="ctrl">
          <label class="small" for="c_page_size">Mostrar</label>
          <select id="c_page_size" class="inl-10">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <button id="c_prev" class="btn btn-ghost" type="button">Anterior</button>
          <span id="c_page_info" class="small">1 / 1</span>
          <button id="c_next" class="btn btn-ghost" type="button">Siguiente</button>
        </div>
      </div>

      <div class="table-scroll">
        <table class="table-clientes">
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th>Nombre</th>
              <th>Telefono</th>
              <th>Tipo</th>
              <th>Doc</th>
              <th>Nro Doc</th>
              <th>Req OC</th>
              <th class="col-actions">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbClientes"></tbody>
        </table>
      </div>

      <div id="msgClientes" class="msg"></div>
    </section>

    <!-- MAQUINAS -->
    <section id="sectionMaquinas" class="card">
      <div class="row">
        <h3 class="inl-1">Maquinas</h3>
        <div class="row2">
          <button id="btnReloadMaquinas" class="btn btn-ghost">Recargar</button>
          <button id="btnAddMaquina" class="btn btn-primary">Agregar</button>
        </div>
      </div>

      <div class="row2 inl-3">
        <input id="m_nombre" placeholder="Nombre (ej: Ryobi #01)" class="inl-4">
        <select id="m_tipo" class="inl-5">
          <option value="OFFSET">OFFSET</option>
          <option value="DIGITAL">DIGITAL</option>
        </select>
      </div>

      <div class="inl-11">
        <table class="table-maquinas">
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th>Nombre</th>
              <th>Tipo</th>
              <th class="col-actions">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbMaquinas"></tbody>
        </table>
      </div>

      <div id="msgMaquinas" class="msg"></div>
    </section>

  </div>
</div>

<div id="importModalWrap" class="modal-wrap hide" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
    <div class="modal-head" id="importModalTitle">Importar clientes</div>
    <div class="modal-body">
      <div id="importModalText" class="small">-</div>
      <div class="modal-actions">
        <button id="importModalCancel" class="btn btn-ghost" type="button">Cancelar</button>
        <button id="importModalOk" class="btn btn-primary" type="button">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="../js/admin_catalogos.js"></script>
</body>
</html>
